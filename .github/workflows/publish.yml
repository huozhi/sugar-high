name: Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  version:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # Trusted publishing needs npm CLI >= 11.5.1; Node 24 ships with npm 11.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Keep the release build independent of mutable dependency caches.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update release PR
        uses: changesets/action@v2
        with:
          version-script: pnpm run version
          pr-title: 'ci: release packages'
          commit-message: 'ci: release packages'

  publish:
    if: github.event_name == 'workflow_dispatch'
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish packages and create GitHub releases
        uses: changesets/action@v2
        with:
          publish-script: pnpm release
          create-github-releases: true
