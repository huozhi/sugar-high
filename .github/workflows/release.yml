name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # npm obtains a short-lived publishing credential from GitHub's OIDC provider.
      NPM_CONFIG_PROVENANCE: "true"
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9

      - uses: actions/setup-node@v6
        with:
          # Trusted publishing needs npm CLI >= 11.5.1; Node 24 ships with npm 11.
          node-version: 24
          registry-url: https://registry.npmjs.org
          # Keep the release build independent of mutable dependency caches.
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create release PR or publish packages
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version
          title: Release packages
          commit: Release packages
        env:
          # Built into every Actions run; used only to manage the Changesets release PR.
          GITHUB_TOKEN: ${{ github.token }}
